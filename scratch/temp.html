    </script>
    <script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

const Icon = ({ name, size = 18, className = "", strokeWidth = 2.5 }) => {
    const wrapperRef = useRef(null);
    useEffect(() => {
        if (window.lucide && wrapperRef.current) {
            wrapperRef.current.innerHTML = `<i data-lucide="${name}" class="${className}" style="width: ${size}px; height: ${size}px; stroke-width: ${strokeWidth}"></i>`;
            lucide.createIcons();
        }
    }, [name, size, className, strokeWidth]);
    return <span ref={wrapperRef} className="inline-flex items-center justify-center pointer-events-none" style={{ width: size, height: size }} />;
};

function App() {
    const [isConnected, setIsConnected] = useState(false);
    const [canSpeed, setCanSpeed] = useState('125k'); // Changed to 125k per user request
    
    // Auto sequence configuration
    const [config, setConfig] = useState({
        targetTolerance: 150,
        stallSpeed: 50,      // counts per second
        stallTime: 2000,     // ms to wait before declaring stall
        originPosition: 0,   // target position when stopped
        minPosition: 0,      // auto sequence min target
        maxPosition: 30000   // auto sequence max target
    });
    const [isSettingsOpen, setIsSettingsOpen] = useState(false);
    const configRef = useRef(config);
    useEffect(() => { configRef.current = config; }, [config]);

    // Node States
    const initialNodeState = {
        connected: false,
        motorState: "OFFLINE",
        statuswordRaw: 0x0000,
        currentPosition: null,
        cycleCount: 0,
        targetPos: 0,
        isSetup: false,
        isAutoMode: false,
        isStopping: false,
        logs: []
    };

    const [newNodeInput, setNewNodeInput] = useState("");

    const [nodes, setNodes] = useState({
        1: { ...initialNodeState }
    });

    const serialManagerRef = useRef(new window.SerialManager());
    const slcanRef = useRef(new window.SLCANProtocol());
    const nmtRef = useRef(new window.CANopenNMT.NMTStateManager());
    const sdoRef = useRef(null);
    
    // Auto sequence Refs
    const autoRefs = useRef({
        1: { lastPos: null, lastPosTime: 0, commandSentTime: 0, currentTarget: 0, stallStartTime: null, retryCount: 0, restartCount: 0 }
    });
    
    const posRefs = useRef({ 1: null });
    const nodesRef = useRef(null); // Always-current mirror of nodes state (avoids closure stale issue)

    const handleAddNode = () => {
        const id = parseInt(newNodeInput);
        if (isNaN(id) || id < 1 || id > 127) {
            alert("유효한 노드 번호(1~127)를 입력하세요.");
            return;
        }
        if (nodes[id]) {
            alert("이미 존재하는 노드입니다.");
            return;
        }
        
        autoRefs.current[id] = { lastPos: null, lastPosTime: 0, commandSentTime: 0, currentTarget: 0, stallStartTime: null, retryCount: 0, restartCount: 0 };
        posRefs.current[id] = null;
        setNodes(prev => ({ ...prev, [id]: { ...initialNodeState } }));
        setNewNodeInput("");
    };

    const handleRemoveNode = (nodeId) => {
        if (nodes[nodeId]?.isAutoMode) {
            alert("노드가 구동 중입니다. 먼저 정지해주세요.");
            return;
        }
        setNodes(prev => {
            const next = { ...prev };
            delete next[nodeId];
            return next;
        });
        delete autoRefs.current[nodeId];
        delete posRefs.current[nodeId];
    };

    const addLog = useCallback((nodeId, dir, id, dlc, data, parsed) => {
        const now = new Date();
        const timeStr = `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}:${now.getSeconds().toString().padStart(2, '0')}.${now.getMilliseconds().toString().padStart(3, '0')}`;
        const idStr = id !== null && id !== undefined ? '0x' + id.toString(16).toUpperCase() : '';
        const logEntry = { time: timeStr, dir, id: idStr, data, parsed };

        setNodes(prev => {
            if (!prev[nodeId]) return prev;
            const newLogs = [...prev[nodeId].logs, logEntry];
            if (newLogs.length > 200) newLogs.shift();
            return { ...prev, [nodeId]: { ...prev[nodeId], logs: newLogs } };
        });
    }, []);

    const decodeStatusword = (swVal) => {
        if (swVal === undefined || swVal === null) return "OFFLINE";
        const val = parseInt(swVal);
        if ((val & 0x004F) === 0x0000) return "NOT READY";
        if ((val & 0x004F) === 0x0040) return "DISABLED";
        if ((val & 0x006F) === 0x0021) return "READY";
        if ((val & 0x006F) === 0x0023) return "SWITCHED ON";
        if ((val & 0x006F) === 0x0027) return "OP ENABLED";
        if ((val & 0x006F) === 0x0007) return "QUICK STOP";
        if ((val & 0x004F) === 0x000F) return "FAULT REACTION";
        if ((val & 0x004F) === 0x0008) return "FAULT";
        return "UNKNOWN";
    };

    if (!sdoRef.current) {
        sdoRef.current = new window.CANopenSDO.SDOManager(async (frame) => {
            if (!serialManagerRef.current || !serialManagerRef.current.isConnected) return;
            const ascii = slcanRef.current.encodeFrame(frame.id, frame.dlc, frame.data);
            try {
                await serialManagerRef.current.write(ascii);
            } catch (err) {
                console.error("[SDO Write Error]", err);
            }
        });
    }

    const sdoMutexRef = useRef(Promise.resolve());
    const runWithSdoLock = async (task) => {
        const currentLock = sdoMutexRef.current;
        let releaseLock;
        const nextLock = new Promise(resolve => { releaseLock = resolve; });
        sdoMutexRef.current = currentLock.then(() => nextLock);
        try {
            return await currentLock.then(task);
        } finally {
            releaseLock();
        }
    };

    const performSdoRead = async (nodeId, idx, sub, timeoutMs = 800) => {
        if (!sdoRef.current || !serialManagerRef.current.isConnected) return null;
        return await runWithSdoLock(async () => {
            try {
                return await sdoRef.current.upload(nodeId, idx, sub, timeoutMs);
            } catch (e) {
                return null;
            }
        });
    };

    const performSdoWrite = async (nodeId, idx, sub, val, len, timeoutMs = 800) => {
        if (!sdoRef.current || !serialManagerRef.current.isConnected) return false;
        return await runWithSdoLock(async () => {
            for (let attempt = 1; attempt <= 2; attempt++) {
                try {
                    await sdoRef.current.download(nodeId, idx, sub, val, len, timeoutMs);
                    return true;
                } catch (e) {
                    if (attempt === 2) return false;
                }
            }
            return false;
        });
    };

    // RPDO: Controlword(2B) + TargetPosition(4B) = 6 bytes fixed (per firmware mapping)
    const sendPdoControl = async (nodeId, controlword, targetPos = 0, silent = false) => {
        if (!serialManagerRef.current || !serialManagerRef.current.isConnected) return;
        
        // Always 6 bytes: [CW_L, CW_H, POS_0, POS_1, POS_2, POS_3]
        const data = new Uint8Array(6);
        data[0] = controlword & 0xFF;
        data[1] = (controlword >> 8) & 0xFF;
        data[2] = targetPos & 0xFF;
        data[3] = (targetPos >> 8) & 0xFF;
        data[4] = (targetPos >> 16) & 0xFF;
        data[5] = (targetPos >> 24) & 0xFF;
        const dlc = 6;
        
        // COB-ID: 0x200 + nodeId (RPDO1 for node1 = 0x201)
        const cobId = 0x200 + nodeId;
        const ascii = slcanRef.current.encodeFrame(cobId, dlc, data);
        const rawHex = Array.from(data).map(b => b.toString(16).padStart(2,'0').toUpperCase()).join(' ');
        await serialManagerRef.current.write(ascii, true); // skipWait: PDO fire-and-forget
        
        if (!silent) {
            const cwHex = controlword.toString(16).padStart(4, '0').toUpperCase();
            addLog(nodeId, 'TX', cobId, dlc, rawHex, `RPDO CW:0x${cwHex} Pos:${targetPos}`);
        }
    };

    const setupSerialListener = () => {
        serialManagerRef.current.onDataReceived = (dataArray) => {
            const asciiChunk = new TextDecoder().decode(dataArray);
            slcanRef.current.parseStream(asciiChunk, (frame) => {
                if (frame.id === undefined) return;

                const dataStr = Array.from(frame.data).map(b => b.toString(16).padStart(2, '0').toUpperCase()).join(' ');

                // TPDO recognition: COB-ID 0x181~0x4FF (TPDO1~4 for node 1~127)
                const isTpdo = (frame.id >= 0x181 && frame.id <= 0x4FF) && ((frame.id & 0x780) === 0x180 || (frame.id & 0x780) === 0x280 || (frame.id & 0x780) === 0x380 || (frame.id & 0x780) === 0x480);

                if (isTpdo) {
                    const nId = frame.id & 0x7F;
                    if (frame.dlc >= 6) {
                        const view = new DataView(frame.data.buffer, frame.data.byteOffset, frame.data.byteLength);
                        
                        // [Sub 1] Byte 0, 1: Statusword 0x6041 (16-bit Unsigned)
                        const sw = view.getUint16(0, true);
                        const mState = decodeStatusword(sw);

                        // [Sub 2] Byte 2, 3, 4, 5: Position_actual_value 0x6064 (32-bit Signed)
                        let pos = view.getInt32(2, true);
                        
                        const prevPos = posRefs.current[nId];
                        posRefs.current[nId] = pos;
                        
                        setNodes(prev => {
                            if (!prev[nId]) return prev;
                            const posChanged = prev[nId].currentPosition !== pos;
                            const stateChanged = prev[nId].statuswordRaw !== sw;
                            if (!posChanged && !stateChanged) return prev;
                            
                            return {
                                ...prev,
                                [nId]: {
                                    ...prev[nId],
                                    currentPosition: pos,
                                    statuswordRaw: sw,
                                    motorState: mState
                                }
                            };
                        });

                        // Position & state updated silently in UI without spamming log window
                    }
                } else {
                    // Log other RX messages (SDO, NMT, etc)
                    let nId = null;
                    let desc = 'CAN Frame';
                    
                    if (frame.id >= 0x581 && frame.id <= 0x583) {
                        nId = frame.id - 0x580;
                        desc = 'SDO Response';
                    } else if (frame.id >= 0x701 && frame.id <= 0x703) {
                        nId = frame.id - 0x700;
                        desc = 'NMT Heartbeat';
                    }
                    
                    if (nId) {
                        addLog(nId, 'RX', frame.id, frame.dlc, dataStr, desc);
                    }
                }

                // Normal NMT / SDO updates
                if (!nmtRef.current.update(frame)) {
                    sdoRef.current.handleResponse(frame);
                }
            });
        };
    };

    const handleConnect = async () => {
        if (isConnected) {
            await serialManagerRef.current.disconnect();
            setIsConnected(false);
            return;
        }
        try {
            const success = await serialManagerRef.current.connect(2000000);
            if (success) {
                // Clear any hanging buffers in the adapter
                await serialManagerRef.current.write("\r\r", true);
                await new Promise(r => setTimeout(r, 100));
                
                await serialManagerRef.current.write(slcanRef.current.encodeClose());
                await new Promise(r => setTimeout(r, 200));
                await serialManagerRef.current.write(slcanRef.current.encodeSpeed(canSpeed));
                await new Promise(r => setTimeout(r, 200));
                await serialManagerRef.current.write(slcanRef.current.encodeOpen());
                await new Promise(r => setTimeout(r, 200));
                setIsConnected(true);
                setupSerialListener();
            } else {
                alert("연결에 실패했습니다.");
            }
        } catch (e) {
            alert("연결 중 오류: " + e.message);
        }
    };

    const getCurrentPos = async (nodeId) => {
        let pos = posRefs.current[nodeId];
        if (pos !== null) return pos;
        
        pos = nodes[nodeId].currentPosition;
        if (pos !== null) return pos;
        
        const res = await performSdoRead(nodeId, 0x6064, 0, 200); // 200ms timeout
        if (res && res.length >= 4) {
            pos = res[0] | (res[1] << 8) | (res[2] << 16) | (res[3] << 24);
            if (pos > 0x7FFFFFFF) pos -= 0x100000000;
            
            posRefs.current[nodeId] = pos;
            setNodes(prev => ({
                ...prev,
                [nodeId]: { ...prev[nodeId], currentPosition: pos }
            }));
        } else {
            pos = 0; // fallback
        }
        return pos;
    };

    // Read Statusword (0x6041) via SDO and update node motorState
    const readAndUpdateStatus = async (nodeId) => {
        if (!sdoRef.current || !serialManagerRef.current.isConnected) return null;
        return await runWithSdoLock(async () => {
            try {
                // upload() resolves with a raw uint32 number
                const swVal = await sdoRef.current.upload(nodeId, 0x6041, 0, 1000);
                const sw = swVal & 0xFFFF; // Take lower 16 bits (UINT16)
                const mState = decodeStatusword(sw);
                const swHex = sw.toString(16).toUpperCase().padStart(4, '0');
                addLog(nodeId, 'RX', 0x580 + nodeId, 4, `${swHex.slice(2)} ${swHex.slice(0,2)}`, `SDO 0x6041 = 0x${swHex} → [${mState}]`);
                setNodes(prev => ({
                    ...prev,
                    [nodeId]: { ...prev[nodeId], statuswordRaw: sw, motorState: mState }
                }));
                return mState;
            } catch (e) {
                addLog(nodeId, 'ERR', null, null, '', `SDO Read 0x6041 failed: ${e.message}`);
                return null;
            }
        });
    };

    // Write Controlword (0x6040) via SDO
    const writeControlwordSDO = async (nodeId, cw) => {
        const cwHex = cw.toString(16).toUpperCase().padStart(4, '0');
        const ok = await performSdoWrite(nodeId, 0x6040, 0, cw, 2, 1000);
        if (ok) {
            addLog(nodeId, 'TX', 0x600 + nodeId, 8, `2B 40 60 00 ${cwHex.slice(2)} ${cwHex.slice(0,2)} 00 00`, `SDO Write 0x6040 = 0x${cwHex} (CiA402 CW)`);
        } else {
            addLog(nodeId, 'ERR', null, null, '', `SDO Write 0x6040 failed (CW=0x${cwHex})`);
        }
        return ok;
    };

    const setupNode = async (nodeId) => {
        if (!isConnected) return;
        addLog(nodeId, 'SYS', null, null, '', `=== Setup Node ${nodeId} (SDO-based) ===`);

        try {
            // Step 0: Ensure NMT Operational for TPDO transmission
            addLog(nodeId, 'SYS', null, null, '', 'Step 0: Sending NMT Operational...');
            const nmtOpFrame = nmtRef.current.buildFrame(0x01, nodeId);
            const nmtOpAscii = slcanRef.current.encodeFrame(nmtOpFrame.id, nmtOpFrame.dlc, nmtOpFrame.data);
            await serialManagerRef.current.write(nmtOpAscii, true);
            await new Promise(r => setTimeout(r, 200));

            // Step 1: Set Profile Position Mode (0x6060 = 1) BEFORE Enabling Operation
            addLog(nodeId, 'SYS', null, null, '', 'Setting Mode of Operation = Profile Position (0x6060=1)...');
            await performSdoWrite(nodeId, 0x6060, 0, 1, 1, 1000);
            await new Promise(r => setTimeout(r, 100));

            // Step 2: Read Actual Position (0x6064)
            addLog(nodeId, 'SYS', null, null, '', 'Reading Actual Position (0x6064)...');
            try {
                const sdoPosRes = await performSdoRead(nodeId, 0x6064, 0, 1000);
                if (sdoPosRes && sdoPosRes.data !== undefined) {
                    let curP = sdoPosRes.data;
                    if (curP > 0x7FFFFFFF) curP -= 0x100000000;
                    posRefs.current[nodeId] = curP;
                    setNodes(prev => ({ ...prev, [nodeId]: { ...prev[nodeId], currentPosition: curP } }));
                    addLog(nodeId, 'SYS', null, null, '', `Current Position (0x6064): ${curP}`);
                }
            } catch (ePos) {
                console.warn("Read 0x6064 failed:", ePos);
            }

            // Step 3: Shutdown (CW = 0x0006)
            addLog(nodeId, 'SYS', null, null, '', 'Step 1/3: Sending Shutdown (CW=0x0006)...');
            await writeControlwordSDO(nodeId, 0x0006);
            await new Promise(r => setTimeout(r, 150));
            const s1 = await readAndUpdateStatus(nodeId);
            addLog(nodeId, 'SYS', null, null, '', `After Shutdown: [${s1}]`);

            // Step 4: Switch On (CW = 0x0007)
            addLog(nodeId, 'SYS', null, null, '', 'Step 2/3: Sending Switch On (CW=0x0007)...');
            await writeControlwordSDO(nodeId, 0x0007);
            await new Promise(r => setTimeout(r, 150));
            const s2 = await readAndUpdateStatus(nodeId);
            addLog(nodeId, 'SYS', null, null, '', `After Switch On: [${s2}]`);

            // Step 5: Enable Operation (CW = 0x000F)
            addLog(nodeId, 'SYS', null, null, '', 'Step 3/3: Sending Enable Operation (CW=0x000F)...');
            await writeControlwordSDO(nodeId, 0x000F);
            await new Promise(r => setTimeout(r, 150));
            const s3 = await readAndUpdateStatus(nodeId);
            addLog(nodeId, 'SYS', null, null, '', `After Enable Op: [${s3}]`);

            const ok = s3 === 'OP ENABLED';
            setNodes(prev => ({
                ...prev,
                [nodeId]: { ...prev[nodeId], connected: true, isSetup: ok }
            }));
            if (ok) {
                addLog(nodeId, 'SYS', null, null, '', `✓ Node ${nodeId} Ready! State: OP ENABLED. Press Start.`);
            } else {
                addLog(nodeId, 'ERR', null, null, '', `✗ Expected OP ENABLED but got [${s3}]. Check motor status.`);
            }
        } catch (e) {
            addLog(nodeId, 'ERR', null, null, '', `Setup error: ${e.message}`);
        }
    };

    const handleFaultReset = async (nodeId) => {
        if (!isConnected) return;
        addLog(nodeId, 'SYS', null, null, '', `Fault Resetting Node ${nodeId}...`);
        
        // Fault Reset: ensure NMT Operational first, then bit7 0->1 transition
        const nmtOpFr = nmtRef.current.buildFrame(0x01, nodeId);
        const nmtOpAsc = slcanRef.current.encodeFrame(nmtOpFr.id, nmtOpFr.dlc, nmtOpFr.data);
        await serialManagerRef.current.write(nmtOpAsc, true);
        addLog(nodeId, 'TX', nmtOpFr.id, nmtOpFr.dlc,
            Array.from(nmtOpFr.data).map(b=>b.toString(16).padStart(2,'0').toUpperCase()).join(' '),
            'NMT Operational');
        await new Promise(r => setTimeout(r, 300));
        
        await sendPdoControl(nodeId, 0x0000); // Clear CW
        await new Promise(r => setTimeout(r, 100));
        await sendPdoControl(nodeId, 0x0080); // Bit7 = 1 (Fault Reset)
        await new Promise(r => setTimeout(r, 200));
        await sendPdoControl(nodeId, 0x0006); // Shutdown (back to normal)
        addLog(nodeId, 'SYS', null, null, '', `Fault Reset complete. Run Setup again to enable motor.`);
    };

    const handleReset = async (nodeId) => {
        if (!isConnected) return;
        addLog(nodeId, 'SYS', null, null, '', `NMT Reset Node ${nodeId}...`);
        const nmtFrame = nmtRef.current.buildFrame(0x81, nodeId);
        const nmtAscii = slcanRef.current.encodeFrame(nmtFrame.id, nmtFrame.dlc, nmtFrame.data);
        await serialManagerRef.current.write(nmtAscii, true);
        addLog(nodeId, 'TX', nmtFrame.id, nmtFrame.dlc,
            Array.from(nmtFrame.data).map(b=>b.toString(16).padStart(2,'0').toUpperCase()).join(' '),
            'NMT Reset Node');
        
        setNodes(prev => ({
            ...prev,
            [nodeId]: { ...prev[nodeId], isSetup: false, isAutoMode: false, currentPosition: null, statuswordRaw: 0, motorState: 'OFFLINE' }
        }));
        posRefs.current[nodeId] = null;
    };

    const handleCycleReset = (nodeId) => {
        setNodes(prev => ({ ...prev, [nodeId]: { ...prev[nodeId], cycleCount: 0 } }));
    };

    const handleToggleStart = (nodeId) => {
        if (!isConnected) return;
        
        let action = null;
        
        setNodes(prev => {
            const node = prev[nodeId];
            const newAuto = !node.isAutoMode;
            
            if (newAuto) {
                action = 'start';
                return { ...prev, [nodeId]: { ...node, isAutoMode: true, isStopping: false, logs: [] } };
            } else {
                action = 'stop';
                return { ...prev, [nodeId]: { ...node, isAutoMode: false, isStopping: false } };
            }
        });

        if (action === 'start') {
            const minP = configRef.current.minPosition;
            
            // Always start with Position 1 (minP)
            const firstTarget = minP;

            addLog(nodeId, 'SYS', null, null, '', `Start: Pre-Op → Operational + Position Control (Target: Position 1 = ${firstTarget})`);
            autoRefs.current[nodeId].currentTarget = firstTarget;
            autoRefs.current[nodeId].commandSentTime = Date.now();
            autoRefs.current[nodeId].waitingTrigger = false;
            autoRefs.current[nodeId].stallStartTime = null;
            autoRefs.current[nodeId].lastPos = null;
            autoRefs.current[nodeId].lastPosTime = 0;
            autoRefs.current[nodeId].retryCount = 0;
            autoRefs.current[nodeId].restartCount = 0;
            
            (async () => {
                // Step 1: NMT Pre-Op -> Operational
                const nmtOpFrame = nmtRef.current.buildFrame(0x01, nodeId);
                const nmtOpAscii = slcanRef.current.encodeFrame(nmtOpFrame.id, nmtOpFrame.dlc, nmtOpFrame.data);
                await serialManagerRef.current.write(nmtOpAscii, true);
                addLog(nodeId, 'TX', nmtOpFrame.id, nmtOpFrame.dlc,
                    Array.from(nmtOpFrame.data).map(b=>b.toString(16).padStart(2,'0').toUpperCase()).join(' '),
                    'NMT Operational');
                await new Promise(r => setTimeout(r, 200));
                
                // Step 2: Set Profile Position Mode (0x6060 = 1) BEFORE Enabling Operation
                addLog(nodeId, 'SYS', null, null, '', 'Setting Mode of Operation = Profile Position (0x6060=1)...');
                const modeOk = await performSdoWrite(nodeId, 0x6060, 0, 1, 1, 1000);
                if (modeOk) {
                    addLog(nodeId, 'TX', 0x600+nodeId, 8, '2F 60 60 00 01 00 00 00', 'SDO Write 0x6060 = 1 (Profile Position Mode)');
                } else {
                    addLog(nodeId, 'ERR', null, null, '', 'Failed to set Mode of Operation. Motor may not move.');
                }
                await new Promise(r => setTimeout(r, 150));

                // Step 3: Single-shot CiA402 State Transition to Position 1 (Shutdown -> Switch On -> 0x001F Enable Op + Trigger)
                addLog(nodeId, 'SYS', null, null, '', `Seamless Start to Position 1 (${minP})...`);
                await sendPdoControl(nodeId, 0x0006, minP, true); // Shutdown
                await new Promise(r => setTimeout(r, 100));
                await sendPdoControl(nodeId, 0x0007, minP, true); // Switch On
                await new Promise(r => setTimeout(r, 100));
                await sendPdoControl(nodeId, 0x000F, minP, true); // Enable Op (Trigger off)
                await new Promise(r => setTimeout(r, 50));
                await sendPdoControl(nodeId, 0x001F, minP); // Enable Op + New Setpoint (Trigger on)
                
                // Update commandSentTime AFTER all setup is done
                autoRefs.current[nodeId].commandSentTime = Date.now();
                
                // Mark isSetup so auto-loop can run
                setNodes(prev => ({ ...prev, [nodeId]: { ...prev[nodeId], isSetup: true } }));
                addLog(nodeId, 'SYS', null, null, '', `Auto position loop started (Target: Position 1 = ${minP})`);
            })();
        } else if (action === 'stop') {
            const stopPos = configRef.current.originPosition;
            addLog(nodeId, 'SYS', null, null, '', `Stop: Command origin (${stopPos}), change to Pre-Op, exit Auto Mode.`);
            autoRefs.current[nodeId].currentTarget = stopPos;
            autoRefs.current[nodeId].commandSentTime = Date.now();
            autoRefs.current[nodeId].stallStartTime = null;
            
            (async () => {
                // 1. Send command to origin
                await sendPdoControl(nodeId, 0x000F, stopPos);
                await new Promise(r => setTimeout(r, 10));
                await sendPdoControl(nodeId, 0x001F, stopPos);
                await new Promise(r => setTimeout(r, 100)); // Brief delay before Pre-Op
                
                // 2. NMT Pre-Op
                const nmtPreFrame = nmtRef.current.buildFrame(0x80, nodeId);
                const nmtPreAscii = slcanRef.current.encodeFrame(nmtPreFrame.id, nmtPreFrame.dlc, nmtPreFrame.data);
                await serialManagerRef.current.write(nmtPreAscii, true);
                addLog(nodeId, 'TX', nmtPreFrame.id, nmtPreFrame.dlc,
                    Array.from(nmtPreFrame.data).map(b=>b.toString(16).padStart(2,'0').toUpperCase()).join(' '),
                    'NMT Pre-Op');
            })();
        }
    };

    const handleJogSDO = async (nodeId, direction) => {
        if (!isConnected || nodesRef.current[nodeId]?.isAutoMode) return;
        
        const targetPos = direction === 'CW' ? configRef.current.maxPosition : configRef.current.minPosition;
        
        addLog(nodeId, 'SYS', null, null, '', `Manual ${direction} SDO: Writing ${targetPos} to Target Position (0x607A)...`);
        
        // Write to Target Position (0x607A, SubIndex 0)
        const ok = await performSdoWrite(nodeId, 0x607A, 0, targetPos, 4);
        
        if (ok) {
            addLog(nodeId, 'SYS', null, null, '', `${direction} SDO Target Position Set Successfully.`);
            // Send trigger via SDO to Controlword (0x6040)
            await performSdoWrite(nodeId, 0x6040, 0, 0x000F, 2);
            await new Promise(r => setTimeout(r, 20));
            await performSdoWrite(nodeId, 0x6040, 0, 0x001F, 2);
        } else {
            addLog(nodeId, 'ERR', null, null, '', `${direction} SDO Write Failed.`);
        }
    };

    const handleAllSetup = async () => {
        if (!isConnected) return;
        const ids = Object.keys(nodesRef.current).map(Number);
        for (const id of ids) {
            const node = nodesRef.current[id];
            if (!node.isSetup && !node.isAutoMode) {
                await setupNode(id);
                // Give a short delay between nodes to avoid CAN bus congestion
                await new Promise(r => setTimeout(r, 200));
            }
        }
    };

    const handleAllToggleStart = () => {
        if (!isConnected) return;
        const ids = Object.keys(nodesRef.current).map(Number);
        const anyRunning = ids.some(id => nodesRef.current[id].isAutoMode);
        
        if (anyRunning) {
            // Stop all running nodes
            ids.forEach(id => {
                if (nodesRef.current[id].isAutoMode) {
                    handleToggleStart(id);
                }
            });
        } else {
            // Start all setup nodes
            ids.forEach(id => {
                if (nodesRef.current[id].isSetup && !nodesRef.current[id].isAutoMode) {
                    handleToggleStart(id);
                }
            });
        }
    };

    const handleClearLogs = (nodeId) => {
        setNodes(prev => ({
            ...prev,
            [nodeId]: { ...prev[nodeId], logs: [] }
        }));
    };

    // Keep nodesRef always in sync with nodes state
    useEffect(() => { nodesRef.current = nodes; }, [nodes]);

    // Auto sequence loop - depends ONLY on isConnected, reads nodes via nodesRef to avoid interval reset on every TPDO
    useEffect(() => {
        let interval;
        if (isConnected) {
            interval = setInterval(() => {
                const now = Date.now();
                Object.keys(nodesRef.current).map(Number).forEach(nodeId => {
                    const node = nodesRef.current?.[nodeId];
                    if (!node || !node.isAutoMode || !node.isSetup) return;
                    
                    const refs = autoRefs.current[nodeId];
                    const target = refs.currentTarget;
                    const pos = posRefs.current[nodeId];
                    
                    // If we have position feedback, check if reached target
                    if (pos !== null) {
                        const diff = Math.abs(pos - target);
                        const tolerance = configRef.current.targetTolerance;
                        
                        if (diff <= tolerance) {
                            // Reached: switch target (Normal Auto Mode)
                            const minP = configRef.current.minPosition;
                            const maxP = configRef.current.maxPosition;
                            const nextTarget = target === minP ? maxP : minP;
                            refs.currentTarget = nextTarget;
                            refs.commandSentTime = now;
                            refs.waitingTrigger = false;
                            refs.stallStartTime = null;
                            refs.retryCount = 0;
                            refs.restartCount = 0;
                            refs.lastPos = pos;
                            refs.lastPosTime = now;
                            
                            setNodes(prev => {
                                let newCount = prev[nodeId].cycleCount;
                                if (target === maxP) newCount += 1;
                                return { ...prev, [nodeId]: { ...prev[nodeId], cycleCount: newCount } };
                            });
                            
                            // Single-step position trigger (Perfect CiA 402 Handshake with 0x1F)
                            (async () => {
                                await sendPdoControl(nodeId, 0x000F, nextTarget, true); // trigger off
                                await new Promise(r => setTimeout(r, 10));
                                await sendPdoControl(nodeId, 0x001F, nextTarget, true); // trigger on (Rising edge!)
                                // We don't need to turn it off immediately. The cyclic transmission will hold it at 0x1F.
                            })();
                            return; // Skip stall check on the frame we reached target
                        }
                    }
                    
                    // Cyclic transmission (50ms) to maintain connection (prevent RPDO timeout)
                    // We send 0x001F (Trigger = 31) which keeps New Setpoint HIGH. 
                    // Because Bit 5 is 0, it DOES NOT restart its trajectory profile mid-flight!
                    if (refs.retryCount === 0 && refs.restartCount === 0 && !node.isStopping) {
                        (async () => {
                            await sendPdoControl(nodeId, 0x001F, target, true); // silent, maintain connection
                        })();
                    }
                    
                    // Anti-stall: speed-based detection
                    // Give it a 1000ms grace period after sending a command before checking stall
                    if (pos !== null && refs.lastPos !== null && (now - refs.commandSentTime > 1000)) {
                        const dt = now - refs.lastPosTime;
                        if (dt >= 500) { // Calculate speed every 500ms
                            const dp = Math.abs(pos - refs.lastPos);
                            const speed = (dp / dt) * 1000; // counts per second

                            // Temporarily disable aggressive stall detection to prevent false positives
                            if (false && speed < configRef.current.stallSpeed) {
                                if (refs.stallStartTime === null) {
                                    refs.stallStartTime = now;
                                } else if (now - refs.stallStartTime >= configRef.current.stallTime) {
                                    // STALL DETECTED
                                    if (refs.retryCount < 3) {
                                        refs.retryCount++;
                                        addLog(nodeId, 'ERR', null, null, '', `Motor ${nodeId} stalled! Soft retry ${refs.retryCount}/3...`);
                                        refs.commandSentTime = now;
                                        refs.stallStartTime = null; // Reset stall timer
                                        
                                        (async () => {
                                            await sendPdoControl(nodeId, 0x002F, target);
                                            await new Promise(r => setTimeout(r, 60));
                                            await sendPdoControl(nodeId, 0x003F, target);
                                        })();
                                    } else if (refs.restartCount < 5) {
                                        refs.retryCount = 0;
                                        refs.restartCount++;
                                        addLog(nodeId, 'ERR', null, null, '', `Motor ${nodeId} STILL stalled! Hard restart ${refs.restartCount}/5...`);
                                        refs.commandSentTime = now;
                                        refs.stallStartTime = null; // Reset stall timer
                                        
                                        (async () => {
                                            // 1. NMT Pre-Op
                                            const preFr = nmtRef.current.buildFrame(0x80, nodeId);
                                            await serialManagerRef.current.write(slcanRef.current.encodeFrame(preFr.id, preFr.dlc, preFr.data), true);
                                            await new Promise(r => setTimeout(r, 100));
                                            
                                            // 2. NMT Op
                                            const opFr = nmtRef.current.buildFrame(0x01, nodeId);
                                            await serialManagerRef.current.write(slcanRef.current.encodeFrame(opFr.id, opFr.dlc, opFr.data), true);
                                            await new Promise(r => setTimeout(r, 100));
                                            
                                            // 3. CiA402 Reset
                                            await sendPdoControl(nodeId, 0x0080); // Fault Reset
                                            await new Promise(r => setTimeout(r, 100));
                                            await sendPdoControl(nodeId, 0x0006); // Shutdown
                                            await new Promise(r => setTimeout(r, 100));
                                            await sendPdoControl(nodeId, 0x0007); // Switch On
                                            await new Promise(r => setTimeout(r, 100));
                                            await sendPdoControl(nodeId, 0x000F); // Enable Op
                                            await new Promise(r => setTimeout(r, 200));
                                            
                                            // Resend target
                                            await sendPdoControl(nodeId, 0x002F, target);
                                            await new Promise(r => setTimeout(r, 60));
                                            await sendPdoControl(nodeId, 0x003F, target);
                                        })();
                                    } else {
                                        // CRITICAL FAILURE
                                        addLog(nodeId, 'ERR', null, null, '', `🚨 CRITICAL: Motor ${nodeId} failed to recover! Marking as FAULT.`);
                                        setNodes(prev => ({ ...prev, [nodeId]: { ...prev[nodeId], isAutoMode: false, isStopping: false, motorState: 'FAULT' } }));
                                        
                                        (async () => {
                                            // Stop motor safely
                                            await sendPdoControl(nodeId, 0x000F);
                                            await new Promise(r => setTimeout(r, 100));
                                            const preFr = nmtRef.current.buildFrame(0x80, nodeId);
                                            await serialManagerRef.current.write(slcanRef.current.encodeFrame(preFr.id, preFr.dlc, preFr.data), true);
                                        })();
                                    }
                                }
                            } else {
                                refs.stallStartTime = null; // Speed is good, reset stall timer
                                refs.retryCount = 0;
                                refs.restartCount = 0;
                            }
                            refs.lastPos = pos;
                            refs.lastPosTime = now;
                        }
                    } else if (pos !== null && (refs.lastPos === null || now - refs.lastPosTime >= 500)) {
                        refs.lastPos = pos;
                        refs.lastPosTime = now;
                    }
                });
            }, 50);
        }
        return () => { clearInterval(interval); };
    }, [isConnected]); // Only isConnected - nodes read via nodesRef to prevent interval reset on TPDO

    return (
        <div className="flex-1 flex flex-col p-4 gap-4 max-w-6xl mx-auto w-full h-screen overflow-hidden">
            <header className="flex flex-col items-center justify-center text-center pb-2 border-b border-slate-200 shrink-0">
                <h1 className="text-xl md:text-2xl font-black tracking-tight text-slate-900 uppercase">
                    MULTI-NODE MIGHTYZAP TESTER
                </h1>
            </header>

            <div className="flex justify-center gap-4 w-full shrink-0">
                <div className="flex gap-2 bg-white border border-slate-200 rounded-xl px-3 py-1.5 items-center justify-start text-xs shadow-sm">
                    <button
                        onClick={handleConnect}
                        className={`px-4 py-1.5 rounded-lg font-black text-[10px] uppercase border transition-colors ${isConnected ? 'bg-rose-50 text-rose-600 border-rose-200 hover:bg-rose-100' : 'bg-brand-600 text-white border-brand-700 hover:bg-brand-700'}`}
                    >
                        {isConnected ? "Disconnect Serial" : "Connect Serial"}
                    </button>
                    <div className="w-px h-4 bg-slate-300 mx-1"></div>
                    <button 
                        onClick={handleAllSetup} 
                        disabled={!isConnected}
                        className="px-3 py-1.5 bg-slate-100 border border-slate-200 hover:bg-slate-200 rounded-lg text-[10px] font-bold text-slate-700 uppercase disabled:opacity-50"
                    >
                        All Setup
                    </button>
                    
                    {(() => {
                        const ids = Object.keys(nodes).map(Number);
                        const anyRunning = ids.some(id => nodes[id].isAutoMode);
                        return (
                            <button 
                                onClick={handleAllToggleStart} 
                                disabled={!isConnected}
                                className={`px-3 py-1.5 border rounded-lg text-[10px] font-bold uppercase transition-colors disabled:opacity-50 ${
                                    anyRunning ? 'bg-red-500 text-white border-red-600 hover:bg-red-600' : 'bg-emerald-100 text-emerald-600 border-emerald-300 hover:bg-emerald-200'
                                }`}
                            >
                                {anyRunning ? 'All Stop' : 'All Start'}
                            </button>
                        );
                    })()}
                </div>
                
                <div className="flex gap-2 bg-white border border-slate-200 rounded-xl p-2 items-center text-xs shadow-sm">
                    <label className="flex items-center gap-1 font-bold">
                        Add Node
                        <input type="number" className="w-12 p-1 border rounded bg-slate-50 text-slate-900" placeholder="ID" value={newNodeInput} onChange={e => setNewNodeInput(e.target.value)} />
                    </label>
                    <button onClick={handleAddNode} className="px-3 py-1 bg-brand-600 text-white rounded font-bold hover:bg-brand-700">Add</button>
                    <div className="w-px h-6 bg-slate-300 mx-2"></div>
                    <button onClick={() => setIsSettingsOpen(true)} className="p-1.5 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded">
                        <Icon name="settings" size={16} />
                    </button>
                </div>
            </div>

            {isSettingsOpen && (
                <div className="fixed inset-0 bg-slate-900/50 flex items-center justify-center z-50">
                    <div className="bg-white rounded-2xl p-6 shadow-2xl w-80 max-w-full">
                        <h3 className="font-black text-slate-800 mb-4 flex items-center gap-2">
                            <Icon name="settings" size={20} />
                            Auto Configuration
                        </h3>
                        <div className="flex flex-col gap-3 text-sm">
                            <label className="flex flex-col gap-1">
                                <span className="font-bold text-slate-600">Target Tolerance</span>
                                <input type="number" className="p-2 border rounded bg-slate-50" value={config.targetTolerance} onChange={e => setConfig(p => ({...p, targetTolerance: Number(e.target.value)}))} />
                            </label>
                            <label className="flex flex-col gap-1">
                                <span className="font-bold text-slate-600">Stall Speed (&lt; count/s)</span>
                                <input type="number" className="p-2 border rounded bg-slate-50" value={config.stallSpeed} onChange={e => setConfig(p => ({...p, stallSpeed: Number(e.target.value)}))} />
                            </label>
                            <label className="flex flex-col gap-1">
                                <span className="font-bold text-slate-600">Stall Time (ms)</span>
                                <input type="number" className="p-2 border rounded bg-slate-50" value={config.stallTime} onChange={e => setConfig(p => ({...p, stallTime: Number(e.target.value)}))} />
                            </label>
                            <label className="flex flex-col gap-1">
                                <span className="font-bold text-slate-600">Stop Origin Position</span>
                                <input type="number" className="p-2 border rounded bg-slate-50" value={config.originPosition} onChange={e => setConfig(p => ({...p, originPosition: Number(e.target.value)}))} />
                            </label>
                            <label className="flex flex-col gap-1">
                                <span className="font-bold text-slate-600">Position 1 (Auto)</span>
                                <input type="number" className="p-2 border rounded bg-slate-50" value={config.minPosition} onChange={e => setConfig(p => ({...p, minPosition: Number(e.target.value)}))} />
                            </label>
                            <label className="flex flex-col gap-1">
                                <span className="font-bold text-slate-600">Position 2 (Auto)</span>
                                <input type="number" className="p-2 border rounded bg-slate-50" value={config.maxPosition} onChange={e => setConfig(p => ({...p, maxPosition: Number(e.target.value)}))} />
                            </label>
                        </div>
                        <div className="mt-6 flex justify-end">
                            <button onClick={() => setIsSettingsOpen(false)} className="px-4 py-2 bg-brand-600 hover:bg-brand-700 text-white font-bold rounded-lg">
                                Close
                            </button>
                        </div>
                    </div>
                </div>
            )}

            {/* Individual Node Panels */}
            <div className="flex-1 min-h-0 flex justify-center items-start gap-4 w-full overflow-x-auto p-1 custom-scrollbar">
                {Object.keys(nodes).map(idStr => Number(idStr)).map(id => (
                    <div key={id} className="flex-1 min-w-[280px] max-w-[400px] flex flex-col gap-3 bg-white border border-slate-200 rounded-2xl p-3 relative overflow-hidden shadow-sm">
                        <div className="flex justify-between items-center">
                            <h2 className="font-black text-brand-700 text-sm flex items-center gap-2">
                                <div className={`w-2 h-2 rounded-full ${nodes[id].isSetup ? 'bg-emerald-500 animate-pulse' : 'bg-slate-300'}`} />
                                NODE {id}
                            </h2>
                            <div className="flex items-center gap-2">
                                <span className={`text-[9px] font-mono font-bold px-2 py-0.5 rounded-full ${
                                    nodes[id].motorState === 'OP ENABLED'  ? 'bg-emerald-100 text-emerald-700' :
                                    nodes[id].motorState === 'PDO ACTIVE'  ? 'bg-cyan-100 text-cyan-700' :
                                    nodes[id].motorState === 'SWITCHED ON' ? 'bg-blue-100 text-blue-700' :
                                    nodes[id].motorState === 'READY'       ? 'bg-yellow-100 text-yellow-700' :
                                    nodes[id].motorState === 'FAULT'       ? 'bg-rose-100 text-rose-700' :
                                    nodes[id].motorState === 'OFFLINE'     ? 'bg-slate-100 text-slate-400' :
                                                                              'bg-slate-100 text-slate-500'
                                }`}>{nodes[id].motorState}</span>
                                <button onClick={() => handleRemoveNode(id)} className="p-1 rounded bg-slate-100 text-slate-400 hover:bg-rose-100 hover:text-rose-500 transition-colors">
                                    <Icon name="x" size={14} />
                                </button>
                            </div>
                        </div>
                        
                        <div className="grid grid-cols-2 gap-2">
                            <button
                                onClick={() => setupNode(id)}
                                disabled={!isConnected || nodes[id].isAutoMode}
                                className="py-1.5 bg-slate-50 border border-slate-200 hover:bg-slate-100 rounded text-[9px] font-bold text-slate-700 uppercase"
                            >
                                Setup
                            </button>
                            <button 
                                onClick={() => handleToggleStart(id)}
                                disabled={!isConnected || !nodes[id].isSetup}
                                className={`py-1.5 rounded text-[9px] font-bold uppercase transition-colors text-white ${
                                    !isConnected || !nodes[id].isSetup ? 'bg-slate-300' :
                                    nodes[id].isStopping ? 'bg-orange-500 animate-pulse' :
                                    nodes[id].isAutoMode ? 'bg-rose-500 hover:bg-rose-600' : 
                                    'bg-emerald-500 hover:bg-emerald-600'
                                }`}
                            >
                                {nodes[id].isStopping ? 'Stopping...' : nodes[id].isAutoMode ? 'Stop' : 'Start'}
                            </button>
                        </div>
                        
                        <div className="grid grid-cols-2 gap-2">
                            <button
                                onClick={() => handleJogSDO(id, 'CCW')}
                                disabled={!isConnected || nodes[id].isAutoMode}
                                className="py-1.5 bg-blue-50 border border-blue-200 hover:bg-blue-100 rounded text-[9px] font-bold text-blue-700 uppercase disabled:opacity-50 transition-colors"
                            >
                                위치 1 ({config.minPosition})
                            </button>
                            <button 
                                onClick={() => handleJogSDO(id, 'CW')}
                                disabled={!isConnected || nodes[id].isAutoMode}
                                className="py-1.5 bg-blue-50 border border-blue-200 hover:bg-blue-100 rounded text-[9px] font-bold text-blue-700 uppercase disabled:opacity-50 transition-colors"
                            >
                                위치 2 ({config.maxPosition})
                            </button>
                        </div>

                        <div className="grid grid-cols-2 gap-2">
                            <button
                                onClick={() => handleReset(id)}
                                disabled={!isConnected || nodes[id].isAutoMode}
                                className="py-1.5 bg-amber-50 border border-amber-200 hover:bg-amber-100 rounded text-[9px] font-bold text-amber-700 uppercase"
                            >
                                NMT Reset
                            </button>
                            <button
                                onClick={() => handleFaultReset(id)}
                                disabled={!isConnected || nodes[id].isAutoMode}
                                className="py-1.5 bg-rose-50 border border-rose-200 hover:bg-rose-100 rounded text-[9px] font-bold text-rose-700 uppercase"
                            >
                                Fault Reset
                            </button>
                            <button
                                onClick={() => handleCycleReset(id)}
                                className="col-span-2 py-1.5 bg-purple-50 border border-purple-200 hover:bg-purple-100 rounded text-[9px] font-bold text-purple-700 uppercase"
                            >
                                Reset Cycles
                            </button>
                        </div>

                        <div className="grid grid-cols-2 gap-2">
                            <div className="bg-slate-50 border border-slate-200 p-2 rounded text-center">
                                <span className="text-[9px] text-slate-400 uppercase font-bold block mb-1">Actual Position</span>
                                <span className="font-mono text-lg font-black text-brand-600">{nodes[id].currentPosition !== null ? nodes[id].currentPosition : '---'}</span>
                            </div>
                            <div className="bg-slate-50 border border-slate-200 p-2 rounded text-center">
                                <span className="text-[9px] text-slate-400 uppercase font-bold block mb-1">Cycle Count</span>
                                <span className="font-mono text-3xl font-black text-orange-500">{nodes[id].cycleCount}</span>
                            </div>
                        </div>

                        <div className="flex justify-between items-end">
                            <span className="text-[10px] font-bold text-slate-500 uppercase">Logs</span>
                            <button onClick={() => handleClearLogs(id)} className="text-[9px] px-2 py-0.5 rounded bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold transition-colors">Clear</button>
                        </div>

                        {/* Log Window */}
                        <div className="h-[200px] shrink-0 bg-slate-900 rounded p-2 overflow-y-auto custom-scrollbar flex flex-col gap-1">
                            {nodes[id].logs.map((log, i) => (
                                <div key={i} className={`text-[9px] font-mono leading-tight ${log.dir === 'ERR' ? 'text-rose-400 font-bold' : log.dir === 'SYS' ? 'text-emerald-400' : log.dir === 'TX' ? 'text-cyan-400' : 'text-slate-400'}`}>
                                    <span className="opacity-50">[{log.time}]</span>
                                    {log.dir !== 'SYS' && log.dir !== 'ERR' && (
                                        <span className={`font-bold mx-1 ${log.dir === 'TX' ? 'text-cyan-500' : 'text-purple-400'}`}>[{log.dir}]</span>
                                    )}
                                    {log.parsed}
                                    {(log.id || log.data) && log.dir !== 'SYS' && log.dir !== 'ERR' && (
                                        <span className="opacity-40 ml-1 block pl-[4.5rem]">
                                            ► {log.id && `ID:${log.id} `}{log.data && `[${log.data}]`}
                                        </span>
                                    )}
                                </div>
                            ))}
                        </div>
                    </div>
                ))}
            </div>
        </div>
    );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);

</script>
</body>

</html>
