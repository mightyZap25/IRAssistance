    <script>
        /* --- Inlined script: js/serial_manager.js --- */
        class SerialManager {
            constructor() {
                this.port = null;
                this.reader = null;
                this.onDataReceived = null;
                this.isConnected = false;
                this._writeLock = Promise.resolve(); // Sequential write queue
                this.responseTimeoutMs = 150; // Default response timeout
            }

            async requestPort() {
                try {
                    this.port = await navigator.serial.requestPort();
                    return this.port;
                } catch (err) {
                    console.error("[SerialManager] Port request failed:", err);
                    return null;
                }
            }

            /**
             * Connect to a port
             * @param {number} baudRate 
             * @param {SerialPort} port Optional port if already requested
             */
            async connect(baudRate = 57600, port = null) {
                if (port) this.port = port;
                if (!this.port) {
                    console.log("[SerialManager] No port provided, requesting new port...");
                    await this.requestPort();
                }

                if (!this.port) {
                    console.error("[SerialManager] Cannot connect: No port available.");
                    return false;
                }

                // If port is already open, just update state and return true
                // But check if it's the SAME baudrate. If not, we might need to close/reopen.
                // Web Serial API doesn't expose current baudrate easily, so we usually just trust our internal state.
                if (this.isConnected && this.port.readable && this.port.writable) {
                    console.log("[SerialManager] Port already open and active.");
                    return true;
                }

                try {
                    console.log(`[SerialManager] Opening port at ${baudRate} baud...`);
                    await this.port.open({ baudRate });
                    this.isConnected = true;
                    this.startReading();
                    return true;
                } catch (err) {
                    if (err.name === 'InvalidStateError') {
                        console.warn("[SerialManager] Port is already open (InvalidStateError). Proceeding as connected.");
                        this.isConnected = true;
                        this.startReading();
                        return true;
                    }
                    console.error("[SerialManager] Connection failed:", err);
                    return false;
                }
            }

            async updateBaudrate(baudRate) {
                if (!this.port) return;
                console.log(`[SerialManager] Updating baudrate to ${baudRate}...`);
                this.isConnected = false;
                if (this.reader) {
                    await this.reader.cancel();
                }
                await this.port.close();
                await this.port.open({ baudRate });
                this.isConnected = true;
                this.startReading();
            }

            async startReading() {
                while (this.port?.readable && this.isConnected) {
                    this.reader = this.port.readable.getReader();
                    try {
                        while (true) {
                            const { value, done } = await this.reader.read();
                            if (done) break;
                            if (this.onDataReceived) {
                                this.onDataReceived(value);
                            }
                        }
                    } catch (error) {
                        console.error("[SerialManager] Read error:", error);
                        if (error.name === 'NetworkError') break;
                    } finally {
                        this.reader.releaseLock();
                    }
                }
            }

            /**
             * Sequential write to the serial port
             * @param {string|Uint8Array} data 
             * @param {boolean} skipWait If true, don't set isAwaitingResponse flag
             */
            async write(data, skipWait = false) {
                // Enforce sequential execution via promise chain
                this._writeLock = this._writeLock.then(async () => {
                    if (!this.port) {
                        console.warn("[SerialManager] Write ignored: Port is null.");
                        return;
                    }
                    if (!this.port.writable) {
                        console.warn("[SerialManager] Write ignored: Port not writable (possibly closed).");
                        return;
                    }

                    if (!skipWait) {
                        this.isAwaitingResponse = true;
                        // Safety timeout to release the lock in case of packet loss
                        if (this.responseTimeout) clearTimeout(this.responseTimeout);
                        this.responseTimeout = setTimeout(() => {
                            this.isAwaitingResponse = false;
                        }, this.responseTimeoutMs);
                    } else {
                        this.isAwaitingResponse = false;
                        if (this.responseTimeout) clearTimeout(this.responseTimeout);
                    }

                    const writer = this.port.writable.getWriter();
                    try {
                        const buffer = (typeof data === 'string')
                            ? new TextEncoder().encode(data)
                            : new Uint8Array(data);

                        await writer.write(buffer);
                    } catch (err) {
                        console.error("[SerialManager] Write failure:", err);
                        throw err;
                    } finally {
                        writer.releaseLock();
                    }
                }).catch(err => {
                    console.error("[SerialManager] Queue error during write:", err);
                });

                return this._writeLock;
            }

            async waitForResponse(timeout = 100) {
                const start = Date.now();
                while (this.isAwaitingResponse && Date.now() - start < timeout) {
                    await new Promise(r => setTimeout(r, 2));
                }
                return !this.isAwaitingResponse;
            }

            async disconnect() {
                console.log("[SerialManager] Disconnecting...");
                this.isConnected = false;
                if (this.reader) {
                    await this.reader.cancel();
                }
                if (this.port) {
                    try {
                        await this.port.close();
                    } catch (err) {
                        console.warn("[SerialManager] Error during close:", err);
                    }
                }
                this.port = null;
            }
        }

        window.SerialManager = SerialManager;

    </script>

    <script>
        /* --- Inlined script: js/protocol_canopen/slcan.js --- */
        /**
         * SLCAN Protocol implementation for Total Manager 2
         * Handles ASCII-based CAN serialization protocol for USB-to-CAN adapters
         */

        class SLCANProtocol {
            constructor() {
                this.buffer = "";
            }

            /**
             * Encode Open command
             * @returns {string} "O\r"
             */
            encodeOpen() {
                return "O\r";
            }

            /**
             * Encode Close command
             * @returns {string} "C\r"
             */
            encodeClose() {
                return "C\r";
            }

            /**
             * Encode Speed command
             * @param {string|number} speed CAN Speed (e.g., '250k', 250, 'S5')
             * @returns {string} "S<n>\r"
             */
            encodeSpeed(speed) {
                const speedMap = {
                    '10k': 'S0',
                    '20k': 'S1',
                    '50k': 'S2',
                    '100k': 'S3',
                    '125k': 'S4',
                    '250k': 'S5',
                    '500k': 'S6',
                    '800k': 'S7',
                    '1M': 'S8',
                    '1000k': 'S8'
                };

                let code = 'S4'; // Default 125k
                if (typeof speed === 'string' && speed.startsWith('S')) {
                    code = speed;
                } else {
                    const lookUp = typeof speed === 'number' ? `${speed}k` : speed.toLowerCase();
                    code = speedMap[lookUp] || 'S4';
                }

                return `${code}\r`;
            }

            /**
             * Encode 11-bit standard CAN frame
             * @param {number} id CAN ID (0x000 to 0x7FF)
             * @param {number} dlc Data Length Code (0 to 8)
             * @param {Array|Uint8Array} data Data bytes
             * @returns {string} "t<ID3><DLC><DATA>\r"
             */
            encodeFrame(id, dlc, data) {
                const idHex = id.toString(16).padStart(3, '0').toUpperCase();
                const dlcHex = dlc.toString(16).toUpperCase();
                let dataHex = "";
                for (let i = 0; i < dlc; i++) {
                    dataHex += (data[i] || 0).toString(16).padStart(2, '0').toUpperCase();
                }
                return `t${idHex}${dlcHex}${dataHex}\r`;
            }

            /**
             * Encode 29-bit extended CAN frame
             * @param {number} id CAN ID
             * @param {number} dlc Data Length Code
             * @param {Array|Uint8Array} data Data bytes
             * @returns {string} "T<ID8><DLC><DATA>\r"
             */
            encodeFrameExt(id, dlc, data) {
                const idHex = id.toString(16).padStart(8, '0').toUpperCase();
                const dlcHex = dlc.toString(16).toUpperCase();
                let dataHex = "";
                for (let i = 0; i < dlc; i++) {
                    dataHex += (data[i] || 0).toString(16).padStart(2, '0').toUpperCase();
                }
                return `T${idHex}${dlcHex}${dataHex}\r`;
            }

            /**
             * Decode SLCAN ASCII frame string
             * @param {string} asciiStr e.g., "t18184604100000000\r"
             * @returns {object|null} { id, dlc, data, type, timestamp }
             */
            decodeFrame(asciiStr) {
                const cmd = asciiStr.trim();
                if (!cmd) return null;

                const typeChar = cmd[0];
                let id, dlc, dataStr, timestamp;

                if (typeChar === 't') { // Standard 11-bit
                    id = parseInt(cmd.substring(1, 4), 16);
                    dlc = parseInt(cmd.substring(4, 5), 16);
                    dataStr = cmd.substring(5, 5 + dlc * 2);
                    // Handle timestamp if present (Z1 mode)
                    if (cmd.length > 5 + dlc * 2) {
                        timestamp = parseInt(cmd.substring(5 + dlc * 2), 16);
                    }
                } else if (typeChar === 'T') { // Extended 29-bit
                    id = parseInt(cmd.substring(1, 9), 16);
                    dlc = parseInt(cmd.substring(9, 10), 16);
                    dataStr = cmd.substring(10, 10 + dlc * 2);
                    if (cmd.length > 10 + dlc * 2) {
                        timestamp = parseInt(cmd.substring(10 + dlc * 2), 16);
                    }
                } else if (typeChar === 'r' || typeChar === 'R') { // Remote frames
                    // Not primary focus for now but can be added
                    return { type: 'remote', raw: cmd };
                } else {
                    return { type: 'other', raw: cmd };
                }

                const data = new Uint8Array(dlc);
                for (let i = 0; i < dlc; i++) {
                    data[i] = parseInt(dataStr.substring(i * 2, i * 2 + 2), 16);
                }

                return {
                    id,
                    dlc,
                    data,
                    type: typeChar === 't' ? 'std' : 'ext',
                    timestamp,
                    raw: cmd
                };
            }

            /**
             * Parse stream of ASCII data and call callback for each complete frame
             * @param {string} asciiChunk New data from serial
             * @param {Function} onFrame Callback for each decoded frame
             */
            parseStream(asciiChunk, onFrame) {
                this.buffer += asciiChunk;

                // Frames are delimited by \r (CR)
                let crIndex;
                while ((crIndex = this.buffer.indexOf('\r')) !== -1) {
                    const frameStr = this.buffer.substring(0, crIndex);
                    this.buffer = this.buffer.substring(crIndex + 1);

                    if (frameStr.length > 0) {
                        const decoded = this.decodeFrame(frameStr);
                        if (decoded && onFrame) {
                            onFrame(decoded);
                        }
                    }
                }
            }
        }

        // Export to window for global access in Total Manager 2
        window.SLCANProtocol = SLCANProtocol;

    </script>

    <script>
        /* --- Inlined script: js/protocol_canopen/canopen_nmt.js --- */
        /**
         * CANopen NMT (Network Management) implementation for Total Manager 2
         * Handles Node states and Network Management commands
         */

        const NMT_STATE = {
            BOOT: 0x00,
            STOPPED: 0x04,
            OPERATIONAL: 0x05,
            PRE_OPERATIONAL: 0x7F,
            UNKNOWN: 0xFF
        };

        const NMT_CMD = {
            START: 0x01,
            STOP: 0x02,
            ENTER_PRE_OP: 0x80,
            RESET_NODE: 0x81,
            RESET_COMM: 0x82
        };

        class NMTStateManager {
            constructor() {
                this.nodes = new Map(); // nodeId -> { state, lastHb, hbTimeoutMs }
                this.onStateChange = null;
            }

            /**
             * Process an incoming CAN frame for NMT/Heartbeat
             * @param {object} frame { id, dlc, data }
             */
            update(frame) {
                // Heartbeat COB-ID is 0x700 + NodeID
                if (frame.id >= 0x701 && frame.id <= 0x77F) {
                    const nodeId = frame.id - 0x700;
                    const state = frame.data[0];
                    const now = Date.now();

                    const prevState = this.nodes.has(nodeId) ? this.nodes.get(nodeId).state : null;

                    this.nodes.set(nodeId, {
                        state: state,
                        lastHb: now,
                        hbTimeoutMs: 2000 // Default 2s if not specified
                    });

                    if (prevState !== state && this.onStateChange) {
                        this.onStateChange(nodeId, state, prevState);
                    }
                    return true;
                }
                return false;
            }

            /**
             * Get human readable state name
             * @param {number} state 
             */
            getStateName(state) {
                for (const [name, val] of Object.entries(NMT_STATE)) {
                    if (val === state) return name;
                }
                return "UNKNOWN";
            }

            /**
             * Build NMT command frame
             * @param {number} cmd NMT command from NMT_CMD
             * @param {number} nodeId Node ID (0 for all)
             * @returns {object} { id: 0, dlc: 2, data: [...] }
             */
            buildNmtCommand(cmd, nodeId) {
                return {
                    id: 0x000,
                    dlc: 2,
                    data: [cmd, nodeId]
                };
            }

            /**
             * Alias for buildNmtCommand to maintain compatibility with existing callers
             */
            buildFrame(cmd, nodeId) {
                return this.buildNmtCommand(cmd, nodeId);
            }

            /**
             * Check if a node is considered alive (HB received within timeout)
             * @param {number} nodeId 
             */
            isAlive(nodeId) {
                if (!this.nodes.has(nodeId)) return false;
                const node = this.nodes.get(nodeId);
                return (Date.now() - node.lastHb) < node.hbTimeoutMs;
            }

            /**
             * Get status of all seen nodes
             */
            getAllNodes() {
                const result = [];
                for (const [id, info] of this.nodes) {
                    result.push({
                        nodeId: id,
                        state: info.state,
                        stateName: this.getStateName(info.state),
                        isAlive: this.isAlive(id)
                    });
                }
                return result;
            }
        }

        // Export to window
        window.CANopenNMT = {
            NMT_STATE,
            NMT_CMD,
            NMTStateManager
        };

    </script>

    <script>
        /* --- Inlined script: js/protocol_canopen/canopen_sdo.js --- */
        /**
         * CANopen SDO (Service Data Object) implementation for Total Manager 2
         * Handles Expedited SDO Upload and Download transfers
         */

        const SDO_CS = {
            DOWNLOAD_REQ: 0x20, // Client -> Server: Download (Write)
            DOWNLOAD_RESP: 0x60, // Server -> Client: Download Success
            UPLOAD_REQ: 0x40, // Client -> Server: Upload (Read)
            UPLOAD_RESP: 0x40, // Actually handled via bitmask
            ABORT: 0x80
        };

        const SDO_ABORT_CODES = {
            0x05030000: "Toggle bit not alternated",
            0x05040001: "SDO protocol timed out",
            0x06010000: "Object access not supported",
            0x06010001: "Attempt to read a write only object",
            0x06010002: "Attempt to write a read only object",
            0x06020000: "Object does not exist in the object dictionary",
            0x06040041: "Object cannot be mapped to the PDO",
            0x06070010: "Data type does not match, length of service parameter does not match",
            0x06090011: "Sub-index does not exist",
            0x06090031: "Value range of parameter exceeded",
            0x08000000: "General error",
            0x08000020: "Data cannot be transferred or stored to the application",
            0x08000021: "Data cannot be transferred or stored because of local control"
        };

        class SDOManager {
            constructor(sendFrameCallback) {
                this.sendFrame = sendFrameCallback;
                this.pendingRequests = new Map(); // nodeId-index-sub -> { resolve, reject, timer }
                this.defaultTimeout = 1000;
            }

            /**
             * Build SDO Expedited Download (Write) frame
             */
            buildDownload(nodeId, index, sub, value, size = 4) {
                // Command specifier for expedited download
                // BIT 0: 1 (Expedited), BIT 1: 1 (Size indicated), BITS 2-3: (4 - size)
                const n = 4 - size;
                const cs = 0x23 | (n << 2);

                const data = new Uint8Array(8);
                data[0] = cs;
                data[1] = index & 0xFF;
                data[2] = (index >> 8) & 0xFF;
                data[3] = sub;

                // Value (Little Endian)
                data[4] = value & 0xFF;
                data[5] = (value >> 8) & 0xFF;
                data[6] = (value >> 16) & 0xFF;
                data[7] = (value >> 24) & 0xFF;

                return { id: 0x600 + nodeId, dlc: 8, data };
            }

            /**
             * Build SDO Upload (Read) request frame
             */
            buildUpload(nodeId, index, sub) {
                const data = new Uint8Array(8);
                data[0] = 0x40; // Initiate Upload Request
                data[1] = index & 0xFF;
                data[2] = (index >> 8) & 0xFF;
                data[3] = sub;
                // Remaining bytes 4-7 are 0

                return { id: 0x600 + nodeId, dlc: 8, data };
            }

            /**
             * Process incoming SDO response
             */
            handleResponse(frame) {
                if (frame.id < 0x581 || frame.id > 0x5FF) return false;

                const nodeId = frame.id - 0x580;
                const cs = frame.data[0];
                const index = frame.data[1] | (frame.data[2] << 8);
                const sub = frame.data[3];
                const key = `${nodeId}-${index}-${sub}`;

                const req = this.pendingRequests.get(key);
                if (!req) {
                    console.warn(`[SDO] No pending request matches response: Node ${nodeId}, Index 0x${index.toString(16)}, Sub ${sub}. Current pending keys:`, Array.from(this.pendingRequests.keys()));
                    return false;
                }

                clearTimeout(req.timer);
                this.pendingRequests.delete(key);

                const scs = cs & 0xE0; // Server command specifier bits 5,6,7

                if (scs === 0x80) { // Abort
                    const abortCode = frame.data[4] | (frame.data[5] << 8) | (frame.data[6] << 16) | (frame.data[7] << 24);
                    const msg = SDO_ABORT_CODES[abortCode] || `Unknown Abort (0x${abortCode.toString(16)})`;
                    req.reject(new Error(msg));
                } else if (scs === 0x40) { // Upload (Read) Success
                    // Expedited?
                    const isExpedited = (cs & 0x02) !== 0;
                    if (isExpedited) {
                        const n = (cs >> 2) & 0x03;
                        const size = 4 - n;
                        let val = 0;
                        for (let i = 0; i < size; i++) {
                            val |= (frame.data[4 + i] << (i * 8));
                        }
                        // Handle signed int if needed based on external context, 
                        // but here we return raw unsigned.
                        req.resolve(val);
                    } else {
                        // Segmented upload - not implemented for simple param tuning
                        req.reject(new Error("Segmented SDO not supported yet"));
                    }
                } else if (scs === 0x60) { // Download (Write) Success
                    req.resolve(true);
                } else {
                    req.reject(new Error(`Unexpected SDO SCS: 0x${scs.toString(16)}`));
                }

                return true;
            }

            /**
             * Send SDO Read (Upload) Request
             */
            upload(nodeId, index, sub, timeout) {
                const key = `${nodeId}-${index}-${sub}`;
                return new Promise((resolve, reject) => {
                    if (this.pendingRequests.has(key)) {
                        return reject(new Error("Request already pending for this object"));
                    }

                    const frame = this.buildUpload(nodeId, index, sub);
                    const timer = setTimeout(() => {
                        this.pendingRequests.delete(key);
                        reject(new Error(`SDO Read Timeout (0x${index.toString(16)}:${sub})`));
                    }, timeout || this.defaultTimeout);

                    this.pendingRequests.set(key, { resolve, reject, timer });
                    this.sendFrame(frame);
                });
            }

            /**
             * Send SDO Write (Download) Request
             */
            download(nodeId, index, sub, value, size = 4, timeout) {
                const key = `${nodeId}-${index}-${sub}`;
                return new Promise((resolve, reject) => {
                    if (this.pendingRequests.has(key)) {
                        return reject(new Error("Request already pending"));
                    }

                    const frame = this.buildDownload(nodeId, index, sub, value, size);
                    const timer = setTimeout(() => {
                        this.pendingRequests.delete(key);
                        reject(new Error(`SDO Write Timeout (0x${index.toString(16)}:${sub})`));
                    }, timeout || this.defaultTimeout);

                    this.pendingRequests.set(key, { resolve, reject, timer });
                    this.sendFrame(frame);
                });
            }
        }

        // Export to window
        window.CANopenSDO = {
            SDO_CS,
            SDO_ABORT_CODES,
            SDOManager
        };

    </script>

    <script>
        /* --- Inlined script: js/protocol_canopen/eds_parser.js --- */
        /**
         * CANopen EDS (Electronic Data Sheet) Parser for Total Manager 2
         * Parses .eds files to extract Object Dictionary and Default Mappings
         */

        class EDSParser {
            constructor() {
                this.sections = {}; // sectionName -> { key: value }
            }

            /**
             * Parse EDS flat text content
             * @param {string} content 
             */
            parse(content) {
                this.sections = {};
                this.objects = new Map(); // index:sub -> { name, dataType, defaultValue, access, ... }
                if (!content) return this.sections;

                // Strip UTF-8 BOM if present (\xEF\xBB\xBF) or non-printable prefix
                const cleanContent = content.replace(/^\uFEFF/, '').replace(/^[^\x20-\x7E\[]*/, '');
                const lines = cleanContent.split(/\r?\n|\r/);
                let currentSection = null;

                console.log(`[EDS Parser] Starting. Content length: ${content.length}, Processed Lines: ${lines.length}`);

                for (let i = 0; i < lines.length; i++) {
                    let line = lines[i].trim();
                    if (!line || line.startsWith(';')) continue;

                    // Handle [Section]
                    const sectionMatch = line.match(/^\[\s*([^\];]+?)\s*\]/);
                    if (sectionMatch) {
                        currentSection = sectionMatch[1].trim();
                        if (!this.sections[currentSection]) {
                            this.sections[currentSection] = {};
                        }
                    } else if (currentSection && line.indexOf('=') !== -1) {
                        const eqIdx = line.indexOf('=');
                        const key = line.substring(0, eqIdx).trim();

edObjects=17\r\n1=0x2001\r\n2=0x2010\r\n3=0x2011\r\n4=0x2012\r\n5=0x2013\r\n6=0x2014\r\n7=0x2015\r\n8=0x2016\r\n9=0x2017\r\n10=0x2018\r\n11=0x2019\r\n12=0x201A\r\n13=0x201B\r\n14=0x201C\r\n15=0x201D\r\n16=0x201E\r\n17=0x201F\r\n\r\n[2001]\r\nParameterName=Node ID\r\nObjectType=0x7\r\n;StorageLocation=RAM\r\nDataType=0x0007\r\nAccessType=rw\r\nDefaultValue=0\r\nPDOMapping=0\r\n\r\n[2010]\r\nParameterName=Overload Check Base\r\nObjectType=0x7\r\n;StorageLocation=RAM\r\nDataType=0x0007\r\nAccessType=rw\r\nDefaultValue=0\r\nPDOMapping=0\r\n\r\n[2011]\r\nParameterName=Overload Warnning Level\r\nObjectType=0x7\r\n;StorageLocation=RAM\r\nDataType=0x0007\r\nAccessType=rw\r\nDefaultValue=0\r\nPDOMapping=0\r\n\r\n[2012]\r\nParameterName=U Phase Current Offset\r\nObjectType=0x7\r\n;StorageLocation=RAM\r\nDataType=0x0007\r\nAccessType=rw\r\nDefaultValue=0\r\nPDOMapping=0\r\n\r\n[2013]\r\nParameterName=V Phase Current Offset\r\nObjectType=0x7\r\n;StorageLocation=RAM\r\nDataType=0x0007\r\nAccessType=rw\r\nDefaultValue=0\r\nPDOMapping=0\r\n\r\n[2014]\r\nParameterName=W Phase Current Offset\r\nObjectType=0x7\r\n;StorageLocation=RAM\r\nDataType=0x0007\r\nAccessType=rw\r\nDefaultValue=0\r\nPDOMapping=0\r\n\r\n[2015]\r\nParameterName=Linear Scale Resolution\r\nObjectType=0x7\r\n;StorageLocation=RAM\r\nDataType=0x0007\r\nAccessType=rw\r\nDefaultValue=0\r\nPDOMapping=0\r\n\r\n[2016]\r\nParameterName=Position Loop Gain 3\r\nObjectType=0x7\r\n;StorageLocation=RAM\r\nDataType=0x0007\r\nAccessType=rw\r\nDefaultValue=0\r\nPDOMapping=0\r\n\r\n[2017]\r\nParameterName=Position Loop Gain 6\r\nObjectType=0x7\r\n;StorageLocation=RAM\r\nDataType=0x0007\r\nAccessType=rw\r\nDefaultValue=0\r\nPDOMapping=0\r\n\r\n[2018]\r\nParameterName=Position Loop Gain 9\r\nObjectType=0x7\r\n;StorageLocation=RAM\r\nDataType=0x0007\r\nAccessType=rw\r\nDefaultValue=0\r\nPDOMapping=0\r\n\r\n[2019]\r\nParameterName=Speed Loop Gain 9\r\nObjectType=0x7\r\n;StorageLocation=RAM\r\nDataType=0x0007\r\nAccessType=rw\r\nDefault
